[project]
name = "controlarmour"
version = "0.1.0"
description = "Report what your Python agent does to ControlArmour on this computer and ask it before risky actions. Standard library only."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Coqui Consulting LLC" }]
keywords = ["controlarmour", "ai-agent", "safety", "langchain", "openai-agents", "openhands"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/coqui-consulting/controlarmour-adapters"
Repository = "https://github.com/coqui-consulting/controlarmour-adapters"
Issues = "https://github.com/coqui-consulting/controlarmour-adapters/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
openai-agents = ["openai-agents>=0.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controlarmour*"]
